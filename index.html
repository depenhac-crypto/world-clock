<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
  </head>
  <body>
    <div class="container">
      <h1>
        <svg
          aria-hidden="true"
          width="42"
          height="42"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
        >
          <circle cx="12" cy="12" r="9" stroke-width="1.8" />
          <path d="M12 7v5l3.5 2" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        World Clock
      </h1>
      <select id="city">
        <option value="">Select a city</option>
        <option value="current">My current location</option>
        <option value="America/New_York">New York 🥯</option>
        <option value="Europe/London">London 🫖</option>
        <option value="Europe/Paris">Paris 🥐</option>
        <option value="Asia/Tokyo">Tokyo 🍣</option>
        <option value="Australia/Sydney">Sydney ☕</option>
      </select>

      <div id="cities">
        <div class="city" id="new-york">
          <div>
            <h2>New York</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
        <div class="city" id="london">
          <div>
            <h2>London</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
      </div>
    </div>

    <footer>
      <p>
        Created by
        <a href="www.linkedin.com/in/christina-watson-751465386">
          Christina Watson</a
        >, open-sourced on
        <a
          href="https://github.com/depenhac-crypto/world-clock"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
        and hosted on <a href="https://worldclockcw.netlify.app/">Netlify</a>.
      </p>
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
